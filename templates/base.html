<!DOCTYPE html>
<html lang="en">
<head>
<!-- ============================================================
     GENERATED FILE — DO NOT EDIT.
     Source: content/*.json + templates/base.html
     Rebuild with: npm run build

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">

<!-- Social preview. og:image and og:url MUST be absolute — relative paths are
     silently dropped by LinkedIn, X, Slack and Discord. All four absolute URLs
     below are derived from "origin" in content/site.json. -->
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{OG_IMAGE}}">

<meta name="theme-color" content="{{THEME_COLOR}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0c0f'/><text x='16' y='23' font-family='monospace' font-size='19' font-weight='700' fill='%23ffb347' text-anchor='middle'>iA</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/assets/css/main.css">
</head>

<body data-page="{{PAGE_ID}}">

<a class="skip" href="#main">Skip to content</a>

<nav>
  <div class="nav-inner">
    {{NAV_MARK}}
    <div class="nav-links">
{{NAV}}
    </div>
  </div>
</nav>

<main id="main" tabindex="-1">
{{MAIN}}
</main>

<footer class="site-footer">
  <div class="wrap">
    <div>{{FOOTER_LEFT}}</div>
    <div>{{FOOTER_RIGHT}}</div>
  </div>
</footer>
{{JSONLD}}
</body>
</html>
